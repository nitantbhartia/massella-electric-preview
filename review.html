<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Massella Electric</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .printc { max-width: 5.05in; margin: 1.1rem auto; background: #efe6d4; border-radius: 18px; padding: 1rem; box-shadow: inset 0 0 0 8px #e4d8c0; }
    .printc h1 { font-family: Candal, Georgia, serif; font-size: 1.35rem; margin: 0 0 0.25rem; }
    .printc img { width: 200px; height: 200px; display: block; margin: 0.6rem auto; background: #fff; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #7a241c; color: #efe6d4; border: 0; padding: 0.45rem 0.65rem; text-decoration: none; cursor: pointer; font-family: "Source Code Pro", ui-monospace, monospace; }
    @media print { .lang, .actions { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <article class="printc">
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
    <h1>Massella Electric</h1>
    <p>Aaron Massella · C-10 #1006970</p>
    <p><a class="plain" href="tel:+16199099473">(619) 909-9473</a></p>
    <img src="review-qr.svg" width="200" height="200" alt="QR code to find Massella Electric on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the lampholder" data-es="Volver al portalámparas">Back to the lampholder</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
