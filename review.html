<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Massella Electric</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card {
      width: min(calc(100% - 1.2rem), 5.05in);
      margin: 0.85rem auto 1.6rem;
      background: #f4ecd8;
      border: 10px double #8a6a2a;
      padding: 0.85rem 0.8rem 1rem;
    }
    .card h1 { font-size: 1.55rem; margin: 0.2rem 0; }
    .card img { width: 200px; height: 200px; display: block; margin: 0.5rem auto; background: #fff; }
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.55rem; }
    .actions button, .actions a {
      background: #1b2433; color: #f4ecd8; border: 0; padding: 0.4rem 0.6rem;
      text-decoration: none; cursor: pointer; font-family: "Courier Prime", ui-monospace, monospace;
    }
    @media print {
      .lang, .actions { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <article class="card">
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
    <h1>Massella Electric</h1>
    <p>Aaron Massella · C-10 #1006970</p>
    <p><a class="plain" href="tel:+16199099473">(619) 909-9473</a></p>
    <img src="review-qr.svg" width="200" height="200" alt="QR code to find Massella Electric on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the warranty" data-es="Volver a la garantía">Back to the warranty</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
