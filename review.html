<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Massella Electric</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card { max-width: 480px; margin: 1.2rem auto; background: #f6f0e2; padding: 1.3rem; border: 3px double #1a2744; }
    .card img { width: 220px; height: 220px; display: block; margin: 0.7rem auto; background: #fff; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #1a2744; color: #f6f0e2; border: 0; padding: 0.5rem 0.7rem; text-decoration: none; cursor: pointer; font-family: "Courier Prime", ui-monospace, monospace; }
    @media print { .sheet-top, .actions, .lang { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <header class="sheet-top">
    <span>Massella Electric</span>
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
  </header>
  <article class="card">
    <h1 style="font-size:1.4rem;margin:0 0 0.4rem;">Massella Electric</h1>
    <p>Aaron Massella</p>
    <p><a class="plain" href="tel:+16199099473">(619) 909-9473</a></p>
    <img src="review-qr.svg" width="220" height="220" alt="QR code to find Massella Electric on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the letter" data-es="Volver a la carta">Back to the letter</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
